

<main class="main">
  <mat-toolbar class="example-header">
    <button mat-icon-button aria-label="Menu icon"  *ngIf="isMobile" (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container>
    <mat-sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="isMobile ? 'false' : 'true'">
      <mat-nav-list>
        <a mat-list-item href="">
        <span class="entry">
          <mat-icon>house</mat-icon>
          <span>Dashboard</span>
        </span>
        </a>
        <a mat-list-item href="rooms">
        <span class="entry">
          <mat-icon>meeting_room</mat-icon>
          <span>Rooms</span>
        </span>
        </a>
        <a mat-list-item href="devices">
        <span class="entry">
          <mat-icon>smartphone</mat-icon>
          <span>Devices</span>
        </span>
        </a>
        <a mat-list-item>
        <span class="entry">
          <mat-icon>calendar_month</mat-icon>
          <span>Calendars</span>
        </span>
        </a>
        <a mat-list-item>
        <span class="entry">
          <mat-icon>groups</mat-icon>
          <span>People</span>
        </span>
        </a>
        <a mat-list-item>
        <span class="entry">
          <mat-icon>apartment</mat-icon>
          <span>Institutes</span>
        </span>
        </a>


      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</main>
