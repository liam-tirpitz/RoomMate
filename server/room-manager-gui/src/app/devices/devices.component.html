<table mat-table [dataSource]="devices" class="mat-elevation-z8">


  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.location}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="mac">
    <th mat-header-cell *matHeaderCellDef> MAC </th>
    <td mat-cell *matCellDef="let element"> {{element.device_id}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="battery">
    <th mat-header-cell *matHeaderCellDef> Battery </th>
    <td mat-cell *matCellDef="let element"> {{element.battery}} </td>
  </ng-container>

  <ng-container matColumnDef="last_connection">
    <th mat-header-cell *matHeaderCellDef> Last Connection </th>
    <td mat-cell *matCellDef="let element"> {{element.last_connection}} </td>
  </ng-container>

  <ng-container matColumnDef="room">
    <th mat-header-cell *matHeaderCellDef> Room </th>
    <td mat-cell *matCellDef="let element"> {{element.room_id}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
