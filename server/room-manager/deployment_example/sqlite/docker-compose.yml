services:
  room-manager:
    image: ghcr.io/liam-tirpitz/roommate/room-manager:latest
    restart: always
    ports:
      # Devices use /data and /image, the web UI is at / and the management API at /api
      - 3001:3001
    # Put API_TOKEN (required for the web UI) and the Exchange passwords into ../.env, see the README
    env_file:
      - path: "../.env"
        required: false
    environment:
      - STORAGE=SQLITE
#      - DB_PATH=config/roommate.sqlite     # default, inside the mounted config directory
#      - BATTERY_HISTORY_DAYS=90            # default
    volumes:
      # Holds the database, the logos and, on the first start only, calendars.json to import
      - ../config:/home/node/app/room-manager/config
      - ./logs:/home/node/app/room-manager/logs
