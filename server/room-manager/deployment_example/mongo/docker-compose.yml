services:
  mongodb:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
  room-manager:
    image: ghcr.io/liam-tirpitz/roommate/room-manager:nightly
    restart: always
    depends_on:
      - mongodb
    ports:
      - 3001:3001
    # Optional: secrets such as the Exchange passwords, see the README
    env_file:
      - path: "../.env"
        required: false
    environment:
#      - SECRET=password
#      - API_TOKEN=a-long-random-string   # enables the management API, better placed in ../.env
      - STORAGE=MONGO
      - MONGO_CONNECTION=mongodb://mongodb/roommate
    volumes:
      - ./logs:/home/node/app/room-manager/logs
