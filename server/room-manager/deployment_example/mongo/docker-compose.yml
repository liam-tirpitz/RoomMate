services:
  mongodb:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
  room-manager:
    image: registry.git.rwth-aachen.de/i5/infrastructure/room-mate/room-manager:nightly
    restart: always
    depends_on:
      - mongodb
    ports:
      - 3001:3001
    env_file: "../.env"
    environment:
#      - SECRET=password
      - STORAGE=MONGO
      - MONGO_CONNECTION=mongodb://mongodb/roommate
    volumes:
      - ./logs:/home/node/app/logs
