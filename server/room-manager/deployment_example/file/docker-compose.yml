services:
  room-manager:
    image: ghcr.io/liam-tirpitz/roommate/room-manager:latest
    restart: always
    ports:
      - 3001:3001
    # Optional: secrets such as the Exchange passwords, see the README
    env_file:
      - path: "../.env"
        required: false
    environment:
#      - SECRET=password
#      - API_TOKEN=a-long-random-string   # enables the management API, better placed in ../.env
      - STORAGE=FILE

    volumes:
      # The server runs in /home/node/app/room-manager and reads calendars.json and the logos from its config directory
      - ../config:/home/node/app/room-manager/config
      - ./logs:/home/node/app/room-manager/logs
