name: Docker image

on:
  workflow_call:
    inputs:
      tags:
        description: Space-separated image tags to push, e.g. "nightly" or "v1.2.0 latest"
        required: true
        type: string

jobs:
  image:
    name: Build and push room-manager image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compose image tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          # Registry names have to be lower case, the repository is called RoomMate
          image="ghcr.io/${GITHUB_REPOSITORY,,}/room-manager"
          {
            echo "tags<<EOF"
            for tag in $TAGS; do echo "$image:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies room-manager and the shared datamodels, so the context is server/
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
