name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Semantic release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the version tag and create the GitHub release
      issues: write          # comment on issues fixed by the release
      pull-requests: write   # comment on pull requests included in the release
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: server/room-manager
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full history and all tags to determine the next version
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/room-manager/package-lock.json
      # Only semantic-release is needed here, so skip building native modules like node-canvas
      - run: npm ci -f --ignore-scripts
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the image is built in this
      # run. semantic-release tags HEAD when it releases, so an empty result means no new version.
      - name: Read the released version
        id: version
        run: echo "version=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ needs.release.outputs.version }} latest
